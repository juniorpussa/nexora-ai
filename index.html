<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXORA.AI — Estúdio de Imagem e Vídeo 9:16</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body { background: #090b10; color: #f4f6fb; min-height: 100vh; padding: 24px; }
    .topbar { max-width: 1120px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: 0.06em; color: #fff; }
    .badge { background: #141923; border: 1px solid #263042; padding: 8px 14px; border-radius: 999px; font-size: 13px; color: #9fb0cc; }
    .grid { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #111622; border: 1px solid #1f293d; border-radius: 16px; padding: 20px; }
    .section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #eef3fc; }
    .upload-box { border: 1.5px dashed #2e3b55; border-radius: 12px; padding: 18px; text-align: center; background: #0c1018; cursor: pointer; }
    .upload-box input { display: none; }
    .preview-thumb { margin-top: 14px; max-height: 220px; max-width: 100%; border-radius: 10px; object-fit: contain; display: none; margin-left: auto; margin-right: auto; }
    .styles { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .style-btn { text-align: left; background: #0c1018; border: 1px solid #222d42; border-radius: 12px; padding: 12px 14px; color: #e2e8f5; cursor: pointer; transition: 0.15s; }
    .style-btn:hover, .style-btn.active { border-color: #22c55e; background: #101c17; }
    .style-name { font-size: 13px; font-weight: 700; display: block; margin-bottom: 3px; }
    .style-desc { font-size: 12px; color: #94a3b8; display: block; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    @media (max-width: 520px) { .actions { grid-template-columns: 1fr; } }
    button.primary { background: #22c55e; color: #051109; border: none; border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 800; cursor: pointer; }
    button.secondary { background: #1a2438; color: #f8fafc; border: 1px solid #2d3c59; border-radius: 12px; padding: 14px 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .output-box { min-height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c1018; border: 1px solid #1d2638; border-radius: 12px; padding: 16px; text-align: center; gap: 14px; }
    .status-text { font-size: 13px; color: #9fb0cc; line-height: 1.5; }
    .error-text { font-size: 13px; color: #f87171; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); padding: 10px 14px; border-radius: 10px; }
    .result-media { max-height: 360px; max-width: 100%; border-radius: 12px; }
    .download-link { display: inline-block; margin-top: 4px; background: #22c55e; color: #051109; text-decoration: none; font-weight: 700; font-size: 13px; padding: 10px 16px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">NEXORA.AI</div>
    <div class="badge">Modo de Teste • Imagem + Vídeo 9:16 (5s)</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="section-title">1. Envie a foto do produto e escolha o estilo</div>

      <label class="upload-box" for="fileInput">
        <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Clique para enviar a foto do produto</div>
        <div style="font-size:12px;color:#94a3b8;">PNG ou JPG • Mantém o produto original</div>
        <input type="file" id="fileInput" accept="image/*" />
        <img id="sourcePreview" class="preview-thumb" alt="Pré-visualização do produto" />
      </label>

      <div class="styles" id="styleList">
        <button type="button" class="style-btn active" data-prompt="Fast dynamic commercial studio push-in and orbital sweep around the exact product from the image on a clean minimal showcase pedestal, crisp reflections, high-energy commercial motion, 9:16 vertical framing, no text, no watermarks.">
          <span class="style-name">Vídeo 1 — Fundo Limpo Vitrine Dinâmico</span>
          <span class="style-desc">Movimento comercial ágil, foco nítido no produto e enquadramento 9:16</span>
        </button>

        <button type="button" class="style-btn" data-prompt="High-contrast dark studio commercial shot with dramatic rim lighting, sleek camera dolly and subtle rotation around the exact product, deep shadows and bright highlights, 9:16 vertical framing, no text, no watermarks.">
          <span class="style-name">Vídeo 2 — Estúdio Dark Premium Turbo</span>
          <span class="style-desc">Iluminação escura contrastada, reflexos intensos e visual premium</span>
        </button>

        <button type="button" class="style-btn" data-prompt="Dynamic lifestyle commercial camera movement around the exact product in a modern warm-lit setting, smooth speed-ramp motion and crisp depth of field, 9:16 vertical framing, no text, no watermarks.">
          <span class="style-name">Vídeo 3 — Cena de Uso (Lifestyle) Acelerado</span>
          <span class="style-desc">Movimento dinâmico em ambiente moderno com foco no produto</span>
        </button>

        <button type="button" class="style-btn" data-prompt="Luxury marble and brushed gold commercial showcase with smooth sweeping camera movement around the exact product, rich specular reflections, 9:16 vertical framing, no text, no watermarks.">
          <span class="style-name">Vídeo 4 — Vitrine Luxo &amp; Mármore</span>
          <span class="style-desc">Acabamento sofisticado com mármore, dourado e movimento de câmera</span>
        </button>

        <button type="button" class="style-btn" data-prompt="High-impact commercial ad camera zoom and fast orbital pan around the exact product with energetic studio light sweeps, sharp product fidelity, 9:16 vertical framing, no text, no watermarks.">
          <span class="style-name">Vídeo 5 — Impacto Criativo / Retenção Máxima</span>
          <span class="style-desc">Movimentação rápida de câmera pensada para prender atenção nos primeiros segundos</span>
        </button>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="btnImage">Gerar Imagem Luxo (9:16)</button>
        <button type="button" class="primary" id="btnVideo">Gerar Vídeo Dinâmico 9:16 (5s)</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">2. Resultado da geração</div>
      <div class="output-box" id="outputBox">
        <div class="status-text">Envie a foto de um produto ao lado e clique em <strong>Gerar Imagem Luxo</strong> ou <strong>Gerar Vídeo Dinâmico 9:16</strong> para testar.</div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const sourcePreview = document.getElementById("sourcePreview");
    const styleButtons = document.querySelectorAll(".style-btn");
    const btnImage = document.getElementById("btnImage");
    const btnVideo = document.getElementById("btnVideo");
    const outputBox = document.getElementById("outputBox");

    let base64Data = "";
    let mimeType = "image/jpeg";
    let selectedPrompt = styleButtons[0].dataset.prompt;

    styleButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        styleButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPrompt = btn.dataset.prompt;
      });
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      mimeType = file.type || "image/jpeg";
      const reader = new FileReader();
      reader.onload = () => {
        const result = String(reader.result || "");
        sourcePreview.src = result;
        sourcePreview.style.display = "block";
        const parts = result.split(",");
        base64Data = parts[1] || "";
      };
      reader.readAsDataURL(file);
    });

    function setLoading(msg) {
      btnImage.disabled = true;
      btnVideo.disabled = true;
      outputBox.innerHTML = `<div class="status-text">${msg}</div>`;
    }

    function setError(msg) {
      btnImage.disabled = false;
      btnVideo.disabled = false;
      outputBox.innerHTML = `<div class="error-text">${msg}</div>`;
    }

    async function postApi(payload) {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const rawText = await res.text();
      let parsed;
      try {
        parsed = JSON.parse(rawText);
      } catch {
        throw new Error(`Resposta inesperada do servidor (${res.status}). Tente novamente em instantes.`);
      }
      if (!res.ok || parsed.error) {
        throw new Error(parsed.error || `Erro HTTP ${res.status}`);
      }
      return parsed;
    }

    async function runGeneration(mode) {
      if (!base64Data) {
        setError("Envie primeiro a foto de um produto.");
        return;
      }

      const label = mode === "video" ? "vídeo 9:16 de 5s" : "imagem luxuosa 9:16";
      setLoading(`Enviando pedido de ${label} para a fila...`);

      try {
        const submit = await postApi({
          action: "submit",
          mode,
          imageBase64: base64Data,
          mimeType,
          prompt: mode === "video" ? selectedPrompt : ""
        });

        let attempts = 0;
        const maxAttempts = 90;

        while (attempts < maxAttempts) {
          await new Promise((r) => setTimeout(r, 2000));
          attempts += 1;

          setLoading(
            `Processando ${label} na fila...<br><span style="font-size:12px;color:#64748b;">Consulta ${attempts} • Aguarde sem fechar a aba</span>`
          );

          const st = await postApi({
            action: "status",
            mode,
            requestId: submit.requestId,
            statusUrl: submit.statusUrl,
            responseUrl: submit.responseUrl
          });

          if (st.status === "COMPLETED") {
            btnImage.disabled = false;
            btnVideo.disabled = false;

            if (!st.url) {
              setError("A geração concluiu, mas nenhum ficheiro foi retornado.");
              return;
            }

            if (mode === "video") {
              outputBox.innerHTML = `
                <video class="result-media" src="${st.url}" controls autoplay loop playsinline></video>
                <a class="download-link" href="${st.url}" target="_blank" rel="noopener noreferrer" download>Baixar Vídeo 9:16</a>
              `;
            } else {
              outputBox.innerHTML = `
                <img class="result-media" src="${st.url}" alt="Imagem gerada" />
                <a class="download-link" href="${st.url}" target="_blank" rel="noopener noreferrer" download>Baixar Imagem 9:16</a>
              `;
            }
            return;
          }
        }

        setError("O processamento demorou mais do que o esperado. Tente gerar novamente.");
      } catch (err) {
        setError(err.message || "Erro ao gerar.");
      }
    }

    btnImage.addEventListener("click", () => runGeneration("image"));
    btnVideo.addEventListener("click", () => runGeneration("video"));
  </script>
</body>
</html>
